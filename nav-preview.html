<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字とアイコンの見本 | anpi-fuso</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffdfa;color:#20202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Meiryo,sans-serif;line-height:1.65}main{max-width:1000px;margin:auto;padding:32px 20px 60px}h1{font-size:28px;margin:0 0 8px}h2{font-size:22px;margin:0 0 8px}p{margin:0 0 20px}.lead{color:#55515c}.option{margin-top:28px;padding:24px;border:1px solid #decbd7;border-radius:16px;background:white}.tag{display:inline-block;background:#fde9f8;color:#8f2464;border-radius:20px;padding:2px 12px;font-size:15px;vertical-align:middle}.desktop{display:flex;gap:8px;padding:16px;background:#8f2464;border-radius:12px;flex-wrap:wrap}.tab{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:10px 16px;border:2px solid transparent;border-radius:10px;background:transparent;color:white;font:700 20px/1.4 inherit;font-family:inherit;font-size:20px;font-weight:700;cursor:pointer}.tab[aria-pressed=true]{background:white;color:#8f2464;border-color:white;box-shadow:0 0 0 2px #8f2464 inset}.tab:focus-visible{outline:3px solid #e8b700;outline-offset:3px}svg{width:36px;height:36px;flex:none}.caption{font-size:15px;color:#655560;margin:16px 0 8px}.phone{max-width:390px;background:#fffdfa;border:1px solid #d8cbd3;border-radius:12px;overflow:hidden}.phone-header{text-align:center;padding:16px;color:#655560;font-size:15px}.mobile{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:white;border-top:1px solid #d8cbd3;padding:6px 4px}.mobile .tab{flex-direction:column;gap:4px;padding:8px 0;min-height:88px;color:#4b4550;font-size:16px;border-radius:8px;white-space:nowrap}.mobile .tab[aria-pressed=true]{background:#fde9f8;color:#8f2464;border-color:#8f2464;box-shadow:none}.mobile svg{width:36px;height:36px}a{color:#8f2464}.note{margin-top:26px;font-size:16px}.selection{min-height:1.5em;margin-top:12px;color:#8f2464;font-size:16px}@media(max-width:600px){main{padding:22px 12px}.option{padding:16px 10px}.desktop{display:none}.desktop-caption{display:none}h1{font-size:24px}h2{font-size:20px}}
</style>
</head>
<body><main>
<h1>文字とアイコンの見本</h1>
<p class="lead">大きなアイコンと太字の文字を組み合わせた2案です。ボタンを押すと選択時の見え方を確認できます。</p>
<div id="options"></div>
<p class="note">文字はパソコンで20px、スマートフォンで16px。アイコンは36pxです。現在のスマートフォン表示（文字12px・アイコン26px）から大きくしています。</p>
<p><a href="/">アプリに戻る</a></p>
</main>
<script>
const outline={
input:'<path d="M13 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m16 3 5 5M10 14l-1 5 5-1 8-8a2 2 0 0 0 0-3l-2-2a2 2 0 0 0-3 0z"/><path d="M7 7h3M7 11h2"/>',
list:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M10 7h7M10 12h7M10 17h7M7 7h.01M7 12h.01M7 17h.01"/>',
safety:'<path d="M12 2 3 6v6c0 5 5 8 9 10 4-2 9-5 9-10V6z"/><path d="m7.5 12 3 3 6-6"/>',
location:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/>'};
const solid={
input:'<path d="M5 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-8l-7 7-5 1 1-5 9-9V4a2 2 0 0 0-2-2H5Z"/><path d="m11 16-.5 2 2-.5 9-9-1.5-1.5zM20 4.5l1.5-1.5L24 5.5 22.5 7z"/>',
list:'<rect x="2" y="2" width="20" height="20" rx="3"/><path d="M10 7h7M10 12h7M10 17h7M6 7h.1M6 12h.1M6 17h.1" stroke="var(--icon-cutout, white)" stroke-width="2" stroke-linecap="round"/>',
safety:'<path d="M12 22 3 13C-4 5 7-2 12 5 17-2 28 5 21 13Z"/><path d="m7 12 3 3 7-7" fill="none" stroke="var(--icon-cutout, white)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>',
location:'<path fill-rule="evenodd" d="M12 1a9 9 0 0 0-9 9c0 6 9 13 9 13s9-7 9-13a9 9 0 0 0-9-9Zm0 5a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/>'};
const items=[['input','入力画面'],['list','リスト'],['safety','安否'],['location','現在地']];
const options=[{name:'A：太い線でくっきり',tag:'おすすめ',description:'用紙とペン ／ 箇条書き ／ 盾とチェック ／ 地図ピン',icons:outline,filled:false},{name:'B：塗りつぶしで目立たせる',tag:'',description:'用紙とペン ／ 箇条書き ／ ハートとチェック ／ 地図ピン',icons:solid,filled:true}];
function buttons(option){return items.map(([key,label],i)=>`<button type="button" class="tab" aria-pressed="${i===0}" data-key="${key}"><svg aria-hidden="true" viewBox="0 0 26 26" fill="${option.filled?'currentColor':'none'}" ${option.filled?'':'stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"'}><g transform="translate(1 1)">${option.icons[key]}</g></svg><span>${label}</span></button>`).join('')}
document.getElementById('options').innerHTML=options.map(option=>`<section class="option"><h2>${option.name} ${option.tag?`<span class="tag">${option.tag}</span>`:''}</h2><p>${option.description}</p><p class="caption desktop-caption">パソコンの上部メニュー</p><nav class="desktop" aria-label="${option.name} パソコン">${buttons(option)}</nav><p class="caption">スマートフォンの下部メニュー</p><div class="phone"><div class="phone-header">スマートフォンでの表示例</div><nav class="mobile" aria-label="${option.name} スマートフォン">${buttons(option)}</nav></div><div class="selection" aria-live="polite">選択中：入力画面</div></section>`).join('');
function colorCutouts(){document.querySelectorAll('.tab').forEach(button=>{const desktop=button.closest('.desktop');button.style.setProperty('--icon-cutout',desktop&&button.getAttribute('aria-pressed')==='false'?'#8f2464':button.getAttribute('aria-pressed')==='true'&&!desktop?'#fde9f8':'white')})}
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{const section=button.closest('.option');section.querySelectorAll('.tab').forEach(tab=>tab.setAttribute('aria-pressed',String(tab.dataset.key===button.dataset.key)));section.querySelector('.selection').textContent=`選択中：${button.textContent}`;colorCutouts()}));colorCutouts();
</script>
</body>
</html>
